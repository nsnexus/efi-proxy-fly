# fly.toml app configuration file generated for efi-proxy-fly on 2026-08-14T17:50:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'efi-proxy-fly'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
